<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Question: {{number}}.{{title}}</title>
  <!-- 引入ACE编辑器 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.6/ace.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.6/mode-c_cpp.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.6/theme-chrome.js"></script>
  <style>
    /* 样式部分保持不变 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100vh;
      font-family: "Arial", "Microsoft YaHei", sans-serif;
      background-color: #faf7db;
      color: #333;
      line-height: 1.6;
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 70px;
      padding: 0 66px;
      background-color: #ffffff00;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      z-index: 10;
    }

    .navbar .title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .navbar .title h2 {
      font-weight: 600;
      color: #2d3748;
      transition: transform 0.3s ease;
    }

    .navbar .title:hover h2 {
      transform: scale(1.02);
    }

    .navbar a {
      text-decoration: none;
      color: #333;
      margin: 0 15px;
      font-size: 18px;
      transition: all 0.3s ease;
      position: relative;
    }

    .navbar a:hover {
      color: #286aff;
    }

    .navbar a::after {
      content: "";
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 0;
      height: 2px;
      background-color: #286aff;
      transition: width 0.3s ease;
    }

    .navbar a:hover::after {
      width: 100%;
    }

    .navbar a:active {
      color: #1a56e0;
    }

    .navbar span {
      display: flex;
      align-items: center;
    }

    .question-container {
      flex: 1;
      width: 90%;
      max-width: 1200px;
      margin: 30px auto;
      padding: 30px;
      background-color: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }

    .question-header {
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 1px solid #f0f4f8;
    }

    .question-header .info {
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .question-header .number {
      font-size: 22px;
      font-weight: 600;
      color: #2d3748;
    }

    .question-header .title {
      font-size: 22px;
      font-weight: 600;
      color: #2d3748;
    }

    .difficulty-tag {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
    }

    .difficulty-tag.easy {
      background-color: #e6f7ef;
      color: #2e7d32;
    }

    .difficulty-tag.medium {
      background-color: #fff8e6;
      color: #ff8f00;
    }

    .difficulty-tag.hard {
      background-color: #ffebee;
      color: #d32f2f;
    }

    .question-description {
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .question-description pre {
      margin-bottom: 15px;
      font-size: 16px;
      background-color: #ffffff;
      padding: 15px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 15px 0;
      font-family: monospace;
      border: 1px solid #f0f4f8;
    }

    .code-editor {
      margin-bottom: 25px;
    }

    .code-editor h3 {
      margin-bottom: 12px;
      color: #2d3748;
      font-size: 18px;
    }

    #editor-container {
      width: 100%;
      height: 400px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .action-buttons {
      display: flex;
      gap: 15px;
      margin-top: 20px;
      justify-content: flex-end;
      margin-bottom: 25px;
    }

    .btn {
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      border: none;
    }

    .btn-reset {
      background-color: #f1f5f9;
      color: #64748b;
    }

    .btn-reset:hover {
      background-color: #e2e8f0;
      transform: translateY(-2px);
    }

    .btn-submit {
      background-color: #286aff;
      color: white;
    }

    .btn-submit:hover {
      background-color: #1a56e0;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(40, 106, 255, 0.2);
    }

    .result-section {
      margin-top: 25px;
      padding: 20px;
      border-radius: 8px;
      background-color: #f9fafb;
      border: 1px solid #f0f4f8;
      display: none;
    }

    .result-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 1px solid #f0f4f8;
    }

    .result-icon {
      font-size: 20px;
    }

    .result-title {
      font-size: 18px;
      font-weight: 600;
      color: #2d3748;
    }

    .result-section.success {
      border-color: #c6f6d5;
      background-color: #f0fff4;
    }

    .result-section.success .result-icon,
    .result-section.success .result-status {
      color: #2e7d32;
    }

    .result-section.error {
      border-color: #fecdd3;
      background-color: #fff5f5;
    }

    .result-section.error .result-icon,
    .result-section.error .result-status {
      color: #d32f2f;
    }

    .result-section.warning {
      border-color: #ffe0b2;
      background-color: #fff8e6;
    }

    .result-section.warning .result-icon,
    .result-section.warning .result-status {
      color: #ff8f00;
    }

    .result-details {
      margin-top: 15px;
    }

    .result-item {
      margin-bottom: 8px;
      font-size: 15px;
    }

    .result-label {
      font-weight: 500;
      color: #4a5568;
    }

    .result-output {
      margin-top: 15px;
      padding: 15px;
      border-radius: 6px;
      background-color: #fff;
      border: 1px solid #f0f4f8;
      max-height: 200px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 14px;
      white-space: pre-wrap;
    }

    .footer {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #888;
      font-size: 14px;
      border-top: 1px solid #f0f4f8;
      margin-top: auto;
    }

    @media (max-width: 768px) {
      .navbar {
        padding: 0 20px;
      }

      .navbar a {
        font-size: 16px;
        margin: 0 8px;
      }

      .question-container {
        width: 95%;
        padding: 20px 15px;
        margin: 20px auto;
      }

      .question-header .info {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
      }

      .question-header .number,
      .question-header .title {
        font-size: 19px;
      }

      #editor-container {
        height: 300px;
      }

      .action-buttons {
        flex-direction: column;
        align-items: flex-end;
      }

      .btn {
        width: 100%;
        max-width: 200px;
        padding: 12px;
      }

      .result-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 5px;
      }

      .result-output {
        max-height: 150px;
        padding: 12px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="navbar">
      <div class="title">
        <span>🖥️</span>
        <h2>Online Judge</h2>
      </div>
      <span>
        <a href="/">首页</a>
        <a href="/all_questions">题目列表</a>
      </span>
    </div>

    <div class="question-container">
      <div class="question-header">
        <div class="info">
          <div class="number">{{number}}.</div>
          <div class="title">{{title}}</div>
          <div class="difficulty-tag {{difficulty | lowerCase}}">
            {{difficulty}}
          </div>
        </div>
      </div>

      <div class="question-description">
        <pre>{{description}}</pre>
      </div>

      <div class="code-editor">
        <h3>编写代码</h3>
        <div id="editor-container"></div>
      </div>

      <div class="action-buttons">
        <button class="btn btn-reset">重置</button>
        <button class="btn btn-submit">提交代码</button>
      </div>

      <div id="result-section" class="result-section">
        <div class="result-header">
          <span class="result-icon" id="result-icon">✅</span>
          <h3 class="result-title">运行结果</h3>
          <span class="result-status" id="result-status">编译成功</span>
        </div>
        <div class="result-details">
          <div class="result-item">
            <span class="result-label">状态：</span>
            <span id="result-detail-status">通过所有测试用例</span>
          </div>
          <div class="result-item">
            <span class="result-label">运行时间：</span>
            <span id="result-runtime">-</span>
          </div>
          <div class="result-item">
            <span class="result-label">内存占用：</span>
            <span id="result-memory">-</span>
          </div>
        </div>
        <div class="result-item">
          <span class="result-label">输出/错误信息：</span>
        </div>
        <div class="result-output" id="result-output">
          Hello World!
        </div>
      </div>
    </div>

    <div class="footer">© 2025 Online Judge 平台 | 版权所有</div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      // 初始化ACE编辑器
      const editor = ace.edit("editor-container");
      editor.setTheme("ace/theme/chrome");
      editor.session.setMode("ace/mode/c_cpp");
      editor.setShowPrintMargin(false);
      editor.setFontSize(14);
      editor.setHighlightActiveLine(true);
      editor.session.setTabSize(4);
      editor.session.setUseSoftTabs(true);

      // 启用代码提示
      ace.require("ace/ext/language_tools");
      editor.setOptions({
        enableBasicAutocompletion: true,
        enableSnippets: true,
        enableLiveAutocompletion: true
      });

      // 模板变量（从后端注入）
      const questionNumber = `{{number}}`;
      const timeLimit = `{{ timeLimit }}`;
      const memoryLimit = `{{ memoryLimit }}`;
      const preCode = `{{pre_code}}`;
      editor.session.setValue(preCode);

      // 重置按钮逻辑
      document.querySelector(".btn-reset").addEventListener("click", function () {
        editor.session.setValue(preCode);
        document.getElementById("result-section").style.display = "none";
      });

      // 提交按钮逻辑（修正括号和语法）
      document.querySelector(".btn-submit").addEventListener("click", async function () {
        const code = editor.getValue();
        const resultSection = document.getElementById("result-section");

        // 显示处理中状态
        showProcessingState(resultSection);

        try {
          // 发送请求到后端
          const response = await fetch(`/judge/${questionNumber}`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json; charset=utf-8"
            },
            body: JSON.stringify({
              code: code,
              input: "",
              timeLimit: timeLimit,
              memoryLimit: memoryLimit
            })
          });

          if (!response.ok) {
            throw new Error(`网络错误：${response.status} ${response.statusText}`);
          }

          // 解析后端返回结果
          const serverResult = await response.json();
          updateResultDisplay(resultSection, serverResult);

        } catch (error) {
          handleRequestError(resultSection, error.message);
        }
      });

      // 响应式调整编辑器高度
      function adjustEditorHeight() {
        const container = document.getElementById("editor-container");
        container.style.height = window.innerWidth <= 768 ? "300px" : "400px";
        editor.resize();
      }
      window.addEventListener("resize", adjustEditorHeight);
      adjustEditorHeight();

      // 显示处理中状态
      function showProcessingState(resultSection) {
        resultSection.style.display = "block";
        resultSection.className = "result-section warning";
        document.getElementById("result-icon").textContent = "⏳";
        document.getElementById("result-status").textContent = "处理中";
        document.getElementById("result-detail-status").textContent = "正在编译代码...";
        document.getElementById("result-runtime").textContent = "-";
        document.getElementById("result-memory").textContent = "-";
        document.getElementById("result-output").textContent = "正在提交代码至判题系统，请稍候...";
      }

      // 处理请求错误
      function handleRequestError(resultSection, errorMsg) {
        resultSection.style.display = "block";
        resultSection.className = "result-section error";
        document.getElementById("result-icon").textContent = "❌";
        document.getElementById("result-status").textContent = "请求失败";
        document.getElementById("result-detail-status").textContent = "服务端通信异常";
        document.getElementById("result-runtime").textContent = "-";
        document.getElementById("result-memory").textContent = "-";
        document.getElementById("result-output").textContent = `错误信息：${errorMsg}`;
      }

      // 更新结果展示
      function updateResultDisplay(resultSection, serverResult) {
        const { status, reason, stdout, error } = serverResult;
        let frontStatus, icon, statusText;

        if (status === 0) {
          frontStatus = "success";
          icon = "✅";
          statusText = "运行成功";
        } else if (status === -3) {
          frontStatus = "error";
          icon = "❌";
          statusText = "编译错误";
        } else if (status > 0) {
          frontStatus = "error";
          icon = "❌";
          statusText = "运行时错误";
        } else {
          frontStatus = "error";
          icon = "❌";
          statusText = "服务端错误";
        }

        resultSection.style.display = "block";
        resultSection.className = `result-section ${frontStatus}`;
        document.getElementById("result-icon").textContent = icon;
        document.getElementById("result-status").textContent = statusText;
        document.getElementById("result-detail-status").textContent = reason || "无描述";
        document.getElementById("result-runtime").textContent = serverResult.runtime || "-";
        document.getElementById("result-memory").textContent = serverResult.memory || "-";
        document.getElementById("result-output").textContent = error || stdout || "无输出";
      }
    });
  </script>
</body>

</html>
