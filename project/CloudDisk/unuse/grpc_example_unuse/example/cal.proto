syntax = "proto3";
package calculator;

service Calculator {
    rpc Add (CalculationRequest) returns (CalculationResult);
    rpc Subtract (CalculationRequest) returns (CalculationResult);
}

message CalculationRequest {
    double a = 1;
    double b = 2;
}

message CalculationResult {
    double result = 1;
}

