# etcd
# 服务注册中心地址 -- 改为 IP 地址, 用 docker 不能本地环回(部署在一个机子, 分布式改为各自机子的 IP 即可)
-registryHost=http://127.0.0.1:2379
# 服务监控根目录
-baseService=/service
# 当前实例名称
-instanceName=/speech_service/instance
# 服务实例外部访问地址 -- 改为 IP 地址, 用 docker 不能本地环回(部署在一个机子, 分布式改为各自机子的 IP 即可)
-accessHost=127.0.0.1:16423

# rpc
# rpc 服务默认监听端口
-rpc_linstenPort=16423
# rpc 空闲超时时间
-rpc_idleTimeout=-1
# rpc IO 线程数量
-rpc_numThreads=4

# asr
# ASR 平台应用 ID
-appId=your_app_id
# ASR 平台访问密钥 Key
-apiKey=your_api_key
# ASR 平台加密密钥 Secret
-apiSecret=your_api_secret

# daemon
# 是否启用守护进程
-use_daemon=true
# 守护进程工作目录
-work_dir=""

# -flagfile=${file_name}