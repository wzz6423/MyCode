# etcd
# 服务注册中心地址 -- 改为 IP 地址, 用 docker 不能本地环回(部署在一个机子, 分布式改为各自机子的 IP 即可)
-registryHost=http://127.0.0.1:2379
# 服务监控根目录
-baseService=/service
# 用户服务名称
-userService=/service/user_service
# 消息服务名称
-messageService=/service/message_service
# 当前实例名称
-instanceName=/crony_service/instance
# 服务实例外部访问地址 -- 改为 IP 地址, 用 docker 不能本地环回(部署在一个机子, 分布式改为各自机子的 IP 即可)
-accessHost=127.0.0.1:16428

# rpc
# rpc 服务默认监听端口
-rpc_linstenPort=16428
# rpc 空闲超时时间
-rpc_idleTimeout=-1
# rpc IO 线程数量
-rpc_numThreads=4

# mysql
# mysql user
-user=stellar_post
# mysql crony's password
-pswd=stellar_post
# host
-host=127.0.0.1
# database
-database=stellar_post
# cset
-cset=utf8
# port
-port=0
# connPoolCount
-connPoolCount=4

# elasticsearch
# elastic search url -- 改为 IP 地址, 用 docker 不能本地环回(部署在一个机子, 分布式改为各自机子的 IP 即可)
-esHost=http://127.0.0.1:9200/

# daemon
# 是否启用守护进程
-use_daemon=true
# 守护进程工作目录
-work_dir=""

# -flagfile=${file_name}